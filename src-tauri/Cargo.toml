[package]
name = "terminal-grid"
version = "0.1.0"
description = "Terminal grid with git labels, worktree view and markdown notes"
edition = "2021"

[lib]
name = "terminal_grid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
portable-pty = "0.9"
sysinfo = "0.39"
trash = "5"
notify = "8"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "7"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
