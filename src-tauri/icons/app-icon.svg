<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Terminal Grid master icon. Regenerate the platform set with
      npm run tauri icon src-tauri/icons/app-icon.svg -o src-tauri/icons
    A 2x2 grid of panes; the active pane carries the prompt. Colours are the
    app's design tokens (accent #8ddcff, violet #c8b6ff, surface #0d1020).
  -->
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171d33"/>
      <stop offset="1" stop-color="#090b14"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.18" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#6048b2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6048b2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.88" cy="0.92" r="0.7">
      <stop offset="0" stop-color="#2680a0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2680a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <!-- User-space so the flat cursor line (zero-height bbox) still gets the gradient. -->
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="152" y1="152" x2="492" y2="492">
      <stop offset="0" stop-color="#8ddcff"/>
      <stop offset="1" stop-color="#c8b6ff"/>
    </linearGradient>
    <linearGradient id="activeFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ddcff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#c8b6ff" stop-opacity="0.08"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="0" y="0" width="1024" height="1024" rx="226"/>
    </clipPath>
  </defs>

  <!-- Tile -->
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#surface)"/>
    <rect width="1024" height="1024" fill="url(#glowViolet)"/>
    <rect width="1024" height="1024" fill="url(#glowCyan)"/>
  </g>
  <rect x="3" y="3" width="1018" height="1018" rx="223" fill="none" stroke="url(#edge)" stroke-width="6"/>

  <!-- Inactive panes: quiet outlines with a hint of output -->
  <g fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.26" stroke-width="8">
    <rect x="532" y="152" width="340" height="340" rx="52"/>
    <rect x="152" y="532" width="340" height="340" rx="52"/>
    <rect x="532" y="532" width="340" height="340" rx="52"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.24" stroke-width="20" stroke-linecap="round">
    <path d="M602 240h144M602 302h90"/>
    <path d="M222 620h120M222 682h164"/>
    <path d="M602 620h164M602 682h104M602 744h144"/>
  </g>

  <!-- Active pane with the prompt -->
  <rect x="152" y="152" width="340" height="340" rx="52" fill="url(#activeFill)" stroke="url(#accent)" stroke-width="12"/>
  <g fill="none" stroke="url(#accent)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
    <path d="M236 246l92 76-92 76"/>
    <path d="M352 406h74"/>
  </g>
</svg>
